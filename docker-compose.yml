services:
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: rickmorty-mcp-server
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    networks:
      - rickmorty-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: rickmorty-agent
    depends_on:
      - mcp-server
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_SERVER_URL=http://mcp-server:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LOG_LEVEL=INFO
    env_file:
      - .env
    networks:
      - rickmorty-net
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: streamlit run ui.py --server.port=8501 --server.address=0.0.0.0

networks:
  rickmorty-net:
    driver: bridge